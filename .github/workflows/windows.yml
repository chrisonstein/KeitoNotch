# Windows build for windows/.
# - Every push that touches windows/: test + build, installers attached to the run.
# - A tag "win-vX.Y.Z" (matching windows/src-tauri/tauri.conf.json): signed release + the auto-update feed.
# Repository secrets: TAURI_SIGNING_PRIVATE_KEY (contents of ~/.tauri/keitonotch-windows.key),
# optional GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET for the shared Google client.
name: Windows build

on:
  workflow_dispatch:
  push:
    # Branch pushes build when windows/ changes; tags win-v* always build and release.
    # (Listing only tags would skip branch pushes entirely.)
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["win-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: KeitoNotch-windows
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release and update feed
        if: startsWith(github.ref, 'refs/tags/win-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#win-v}"
          CONF_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$VERSION" = "$CONF_VERSION" ] || { echo "Tag $TAG doesn't match version $CONF_VERSION in tauri.conf.json"; exit 1; }
          node scripts/updater-manifest.mjs "$VERSION" "$GITHUB_REPOSITORY" "$TAG"
          NOTES="release-notes/$VERSION.md"
          [ -f "$NOTES" ] || echo "Keito Notch for Windows $VERSION" > "$NOTES"
          gh release create "$TAG" --title "Keito Notch for Windows $VERSION" --notes-file "$NOTES" --latest=false \
            src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/*.exe.sig \
            src-tauri/target/release/bundle/msi/*.msi latest.json
          # The rolling feed the installed apps read (kept out of "latest", which is the Mac app's).
          gh release view windows-updates >/dev/null 2>&1 || \
            gh release create windows-updates --title "Windows update feed" --notes "Used by Keito Notch for Windows to find updates." --prerelease
          gh release upload windows-updates latest.json --clobber
